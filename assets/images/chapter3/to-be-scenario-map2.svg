    <text x="96" y="106" font-size="36" fill="#FFFFFF" font-weight="800">TO-BE Scenario Map</text>
    <text x="1740" text-anchor="end" y="92" font-size="20" fill="#BFDBFE" font-weight="600">Andrea Salazar · Logistics Operations Coordinator</text>
    <rect x="30" y="225" width="158" height="180" rx="18" fill="#172554"/>
<text x="109" text-anchor="middle" y="321" font-size="18" fill="#FFFFFF" font-weight="800">PHASES</text>
<rect x="210" y="225" width="294" height="180" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="230" y="271" font-size="19" fill="#1E293B" font-weight="800">1. Plan operations</text>
<rect x="516" y="225" width="294" height="180" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="536" y="271" font-size="19" fill="#1E293B" font-weight="800">2. Coordinate</text>
<rect x="822" y="225" width="294" height="180" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="842" y="271" font-size="19" fill="#1E293B" font-weight="800">3. Monitor</text>
<text x="842" y="295" font-size="19" fill="#1E293B" font-weight="800">portfolio</text>
<rect x="1128" y="225" width="294" height="180" rx="18" fill="#DBEAFE" stroke="#F97316" stroke-width="2"/>
<text x="1148" y="271" font-size="19" fill="#1E293B" font-weight="800">4. Resolve</text>
<text x="1148" y="295" font-size="19" fill="#1E293B" font-weight="800">exception</text>
<rect x="1434" y="225" width="294" height="180" rx="18" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="1454" y="271" font-size="19" fill="#1E293B" font-weight="800">5. Evaluate results</text>
<rect x="30" y="415" width="158" height="180" rx="18" fill="#172554"/>
<text x="109" text-anchor="middle" y="511" font-size="18" fill="#FFFFFF" font-weight="800">DOING</text>
<rect x="210" y="415" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="230" y="461" font-size="17" fill="#1E293B" font-weight="500">Organizes routes and</text>
<text x="230" y="485" font-size="17" fill="#1E293B" font-weight="500">assignments from one</text>
<text x="230" y="509" font-size="17" fill="#1E293B" font-weight="500">workspace.</text>
<rect x="516" y="415" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="536" y="461" font-size="17" fill="#1E293B" font-weight="500">Shares a consistent</text>
<text x="536" y="485" font-size="17" fill="#1E293B" font-weight="500">operation state with</text>
<text x="536" y="509" font-size="17" fill="#1E293B" font-weight="500">stakeholders.</text>
<rect x="822" y="415" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="842" y="461" font-size="17" fill="#1E293B" font-weight="500">Uses the dashboard to</text>
<text x="842" y="485" font-size="17" fill="#1E293B" font-weight="500">compare active</text>
<text x="842" y="509" font-size="17" fill="#1E293B" font-weight="500">operations.</text>
<rect x="1128" y="415" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1148" y="461" font-size="17" fill="#1E293B" font-weight="500">Opens the affected trip,</text>
<text x="1148" y="485" font-size="17" fill="#1E293B" font-weight="500">reviews context and</text>
<text x="1148" y="509" font-size="17" fill="#1E293B" font-weight="500">acts.</text>
<rect x="1434" y="415" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1454" y="461" font-size="17" fill="#1E293B" font-weight="500">Reviews completed trips,</text>
<text x="1454" y="485" font-size="17" fill="#1E293B" font-weight="500">history and performance.</text>
<rect x="30" y="605" width="158" height="180" rx="18" fill="#172554"/>
<text x="109" text-anchor="middle" y="701" font-size="18" fill="#FFFFFF" font-weight="800">THINKING</text>
<rect x="210" y="605" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="230" y="651" font-size="17" fill="#1E293B" font-weight="500">Priorities and</text>
<text x="230" y="675" font-size="17" fill="#1E293B" font-weight="500">dependencies are</text>
<text x="230" y="699" font-size="17" fill="#1E293B" font-weight="500">visible.</text>
<rect x="516" y="605" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="536" y="651" font-size="17" fill="#1E293B" font-weight="500">Everyone works from the</text>
<text x="536" y="675" font-size="17" fill="#1E293B" font-weight="500">same information.</text>
<rect x="822" y="605" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="842" y="651" font-size="17" fill="#1E293B" font-weight="500">I know which route needs</text>
<text x="842" y="675" font-size="17" fill="#1E293B" font-weight="500">attention first.</text>
<rect x="1128" y="605" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1148" y="651" font-size="17" fill="#1E293B" font-weight="500">I can communicate an</text>
<text x="1148" y="675" font-size="17" fill="#1E293B" font-weight="500">accurate response.</text>
<rect x="1434" y="605" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1454" y="651" font-size="17" fill="#1E293B" font-weight="500">I can explain outcomes</text>
<text x="1454" y="675" font-size="17" fill="#1E293B" font-weight="500">and improve planning.</text>
<rect x="30" y="795" width="158" height="180" rx="18" fill="#172554"/>
<text x="109" text-anchor="middle" y="891" font-size="18" fill="#FFFFFF" font-weight="800">FEELING</text>
<rect x="210" y="795" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="230" y="841" font-size="17" fill="#1E293B" font-weight="500">Prepared</text>
<rect x="516" y="795" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="536" y="841" font-size="17" fill="#1E293B" font-weight="500">Aligned</text>
<rect x="822" y="795" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="842" y="841" font-size="17" fill="#1E293B" font-weight="500">Clear-headed</text>
<rect x="1128" y="795" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1148" y="841" font-size="17" fill="#1E293B" font-weight="500">Decisive</text>
<rect x="1434" y="795" width="294" height="180" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1454" y="841" font-size="17" fill="#1E293B" font-weight="500">Confident</text>
    <rect x="210" y="1000" width="1530" height="4" rx="2" fill="#2563EB"/>
    <text x="210" y="972" font-size="18" fill="#64748B" font-weight="600">Outcome: fewer manual handoffs, faster decisions and a traceable operation history</text>
