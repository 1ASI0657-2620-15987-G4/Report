<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
    <rect width="1800" height="1100" fill="#F5F8F7"/>
    <rect width="1800" height="132" fill="#123C3A"/>
    <text x="60" y="58" font-size="34" fill="#FFFFFF" font-weight="800">AS-IS SCENARIO MAP</text>
    <text x="60" y="101" font-size="24" fill="#BFE3DF" font-weight="500">Carlos Mendoza · Fleet Supervisor</text>
    <rect x="30" y="210" width="160" height="195" rx="18" fill="#123C3A"/>
<text x="110" text-anchor="middle" y="312" font-size="19" fill="#FFFFFF" font-weight="800">PHASES</text>
<rect x="210" y="210" width="370" height="195" rx="18" fill="#E7F5F3" stroke="#E0A62F" stroke-width="4" stroke-dasharray="12 8"/>
<text x="234" y="262" font-size="23" fill="#075E59" font-weight="800">1. Prepare trip</text>
<rect x="592" y="210" width="370" height="195" rx="18" fill="#E7F5F3" stroke="#DCE8E7" stroke-width="4"/>
<text x="616" y="262" font-size="23" fill="#075E59" font-weight="800">2. Start trip</text>
<rect x="974" y="210" width="370" height="195" rx="18" fill="#E7F5F3" stroke="#E07A5F" stroke-width="4"/>
<text x="998" y="262" font-size="23" fill="#075E59" font-weight="800">3. Monitor route</text>
<rect x="1356" y="210" width="370" height="195" rx="18" fill="#E7F5F3" stroke="#E07A5F" stroke-width="4"/>
<text x="1380" y="262" font-size="23" fill="#075E59" font-weight="800">4. Resolve and close</text>
<rect x="30" y="415" width="160" height="195" rx="18" fill="#123C3A"/>
<text x="110" text-anchor="middle" y="517" font-size="19" fill="#FFFFFF" font-weight="800">DOING</text>
<rect x="210" y="415" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E0A62F" stroke-width="4" stroke-dasharray="12 8"/>
<text x="234" y="467" font-size="20" fill="#263238" font-weight="500">Assigns vehicle, driver and</text>
<text x="234" y="496" font-size="20" fill="#263238" font-weight="500">route using separate records.</text>
<rect x="592" y="415" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#DCE8E7" stroke-width="4"/>
<text x="616" y="467" font-size="20" fill="#263238" font-weight="500">Confirms departure by phone</text>
<text x="616" y="496" font-size="20" fill="#263238" font-weight="500">or messaging and notes the</text>
<text x="616" y="525" font-size="20" fill="#263238" font-weight="500">start time.</text>
<rect x="974" y="415" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4"/>
<text x="998" y="467" font-size="20" fill="#263238" font-weight="500">Checks GPS tools and</text>
<text x="998" y="496" font-size="20" fill="#263238" font-weight="500">repeatedly contacts the</text>
<text x="998" y="525" font-size="20" fill="#263238" font-weight="500">driver for updates.</text>
<rect x="1356" y="415" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4"/>
<text x="1380" y="467" font-size="20" fill="#263238" font-weight="500">Coordinates incidents</text>
<text x="1380" y="496" font-size="20" fill="#263238" font-weight="500">manually and reconstructs the</text>
<text x="1380" y="525" font-size="20" fill="#263238" font-weight="500">trip history.</text>
<rect x="30" y="620" width="160" height="195" rx="18" fill="#123C3A"/>
<text x="110" text-anchor="middle" y="722" font-size="19" fill="#FFFFFF" font-weight="800">THINKING</text>
<rect x="210" y="620" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E0A62F" stroke-width="4" stroke-dasharray="12 8"/>
<text x="234" y="672" font-size="20" fill="#263238" font-weight="500">Do I have every resource and</text>
<text x="234" y="701" font-size="20" fill="#263238" font-weight="500">document ready?</text>
<rect x="592" y="620" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#DCE8E7" stroke-width="4"/>
<text x="616" y="672" font-size="20" fill="#263238" font-weight="500">Did the driver leave on time</text>
<text x="616" y="701" font-size="20" fill="#263238" font-weight="500">and follow the plan?</text>
<rect x="974" y="620" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4"/>
<text x="998" y="672" font-size="20" fill="#263238" font-weight="500">Is this stop normal, or is</text>
<text x="998" y="701" font-size="20" fill="#263238" font-weight="500">the operation at risk?</text>
<rect x="1356" y="620" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4"/>
<text x="1380" y="672" font-size="20" fill="#263238" font-weight="500">Can I explain what happened</text>
<text x="1380" y="701" font-size="20" fill="#263238" font-weight="500">and prevent it next time?</text>
<rect x="30" y="825" width="160" height="195" rx="18" fill="#123C3A"/>
<text x="110" text-anchor="middle" y="927" font-size="19" fill="#FFFFFF" font-weight="800">FEELING</text>
<rect x="210" y="825" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E0A62F" stroke-width="4" stroke-dasharray="12 8"/>
<text x="234" y="877" font-size="20" fill="#263238" font-weight="500">Focused, but cautious about</text>
<text x="234" y="906" font-size="20" fill="#263238" font-weight="500">missing information.</text>
<rect x="592" y="825" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#DCE8E7" stroke-width="4"/>
<text x="616" y="877" font-size="20" fill="#263238" font-weight="500">Alert while waiting for</text>
<text x="616" y="906" font-size="20" fill="#263238" font-weight="500">reliable confirmation.</text>
<rect x="974" y="825" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4"/>
<text x="998" y="877" font-size="20" fill="#263238" font-weight="500">Uncertain and pressured when</text>
<text x="998" y="906" font-size="20" fill="#263238" font-weight="500">data is delayed.</text>
<rect x="1356" y="825" width="370" height="195" rx="18" fill="#FFFFFF" stroke="#E07A5F" stroke-width="4"/>
<text x="1380" y="877" font-size="20" fill="#263238" font-weight="500">Stressed during incidents;</text>
<text x="1380" y="906" font-size="20" fill="#263238" font-weight="500">relieved after closure.</text>
    <circle cx="62" cy="1047" r="8" fill="#E07A5F"/><text x="80" y="1054" font-size="18" fill="#526866">Negative area</text>
    <rect x="260" y="1039" width="18" height="18" rx="3" fill="none" stroke="#E0A62F" stroke-width="3" stroke-dasharray="5 3"/><text x="290" y="1054" font-size="18" fill="#526866">Blank area to investigate</text>
  </svg>